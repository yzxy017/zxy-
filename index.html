<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#E8E9DA">
<title>测一测你适合在哪个城市定居</title>
<meta name="description" content="32 道生活方式趣味题，找到适合你的定居城市与生活节奏。">
<style>
:root{--paper:#e8e9da;--card:#fcfaf1;--ink:#1f2e2a;--muted:#758075;--line:#d6d7c3;--green:#2e6e63;--serif:Georgia,"Songti SC",serif}*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 50% 0,#fffdf4 0,transparent 58%),var(--paper);color:var(--ink);font:15px/1.7 system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;min-height:100vh}.app{max-width:640px;margin:auto;padding:24px 22px 56px}.view{display:none}.view.active{display:block;animation:up .3s ease}@keyframes up{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}.stamp{display:inline-block;border:1px solid #8da99c;color:var(--green);border-radius:4px;padding:4px 10px;font-size:12px;letter-spacing:.12em}h1,h2{font-family:var(--serif);line-height:1.28}h1{font-size:clamp(34px,9vw,54px);margin:24px 0 12px}h1 span{display:block}.lead{color:#4e5c54;max-width:27em}.list{padding:0;list-style:none;margin:28px 0}.list li{padding:7px 0;color:#435249}.list li:before{content:'✓';color:var(--green);margin-right:10px}.btn{width:100%;border:0;border-radius:13px;padding:15px 18px;font:inherit;cursor:pointer;background:var(--ink);color:#f5f2e4;transition:transform .15s,background .2s}.btn:hover{background:#16302c}.btn:active{transform:translateY(2px)}.secondary{background:transparent;color:var(--ink);border:1px solid #b9bfae}.tiny{text-align:center;color:#8b9385;font-size:12px}.bar{display:flex;align-items:center;justify-content:space-between}.back{width:40px;height:40px;border-radius:50%;border:1px solid var(--line);background:#ffffff80;color:var(--ink);font-size:20px;cursor:pointer}.counter{font-size:13px;color:var(--muted)}.counter b{font: bold 22px var(--serif);color:var(--ink)}.progress{height:5px;border-radius:9px;background:#d5d6c2;margin:16px 0 34px;overflow:hidden}.progress i{height:100%;display:block;background:var(--green);transition:width .25s}.qno{font-size:11px;letter-spacing:.18em;color:var(--muted)}h2{font-size:clamp(23px,6vw,29px);margin:9px 0 24px}.options{display:grid;gap:11px}.option{display:flex;align-items:flex-start;gap:12px;text-align:left;width:100%;padding:15px;border-radius:14px;border:1px solid var(--line);background:#fcfaf1d9;color:#2b3934;font:inherit;cursor:pointer}.option:hover,.option.selected{border-color:#7e9c8c;background:#e7eddf}.letter{border:1px solid #c2c7b4;border-radius:50%;width:25px;height:25px;flex:none;text-align:center;line-height:23px;font-size:11px;color:#758075}.result-head{margin-top:24px;padding:25px 22px;border-radius:18px;background:linear-gradient(140deg,color-mix(in srgb,var(--accent) 25%,#f6f4e9),#f6f4e9 72%);border:1px solid #1f2e2a18}.tag{font-size:12px;color:#59685d;letter-spacing:.08em}.result-head h2{font-size:clamp(30px,8vw,40px);margin:8px 0}.cities{display:flex;gap:7px;flex-wrap:wrap}.city{font-size:12px;padding:4px 10px;background:#fff9;border:1px solid #1f2e2a1c;border-radius:99px}.block{margin-top:27px}.block h3{font:700 16px var(--serif);margin:0 0 10px}.block h3:before{content:'';display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--accent);margin-right:9px}.block p{margin:0;color:#3a473f;line-height:1.9}.score{color:var(--green);font-weight:700}.ranking{display:grid;gap:10px}.rank{display:flex;justify-content:space-between;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:#fcfaf1a8;font-size:13px}.actions{display:grid;gap:10px;margin-top:30px}.foot{margin-top:28px;border-top:1px solid #1f2e2a22;padding-top:16px;text-align:center;font-size:11px;color:#858d80}.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:#1f2e2af2;color:#fff;padding:9px 16px;border-radius:99px;opacity:0;transition:opacity .2s;pointer-events:none}.toast.show{opacity:1}@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body><main class="app">
<section id="home" class="view active"><span class="stamp">32 题 · 约 3 分钟</span><h1><span>测一测你适合</span><span>在哪个城市定居</span></h1><p class="lead">凭你的生活喜好，匹配专属你的人生定居城市。</p><ul class="list"><li>生活偏好｜解锁专属定居归宿</li><li>城市适配｜匹配你的人生节奏</li><li>专属解读｜找到最契合你的生活方式</li></ul><button class="btn" id="start">开始测试　→</button><p class="tiny">趣味测试仅供娱乐，愿你奔赴属于自己的山海与温柔。</p></section>
<section id="quiz" class="view"><div class="bar"><button class="back" id="back" aria-label="返回上一题">‹</button><div class="counter"><b id="number">01</b> / 32</div></div><div class="progress"><i id="fill"></i></div><div id="question"></div></section>
<section id="result" class="view"></section>
</main><div class="toast" id="toast"></div>
<script>
const types=[
{name:'温柔宜居小城型',tag:'把被子晒出太阳味的人',cities:['大理','扬州','湖州','泉州'],color:'#C98F86',line:'喜欢楼下有棵大树、菜市场老板记得你的口味，走路十分钟就能到河边。日子不必很大，只要每天都被好好照顾。'},
{name:'繁华一线奋斗型',tag:'凌晨一点还很有电的人',cities:['深圳','上海','杭州','北京'],color:'#DD7C4F',line:'需要城市一直醒着。机会、效率和不断更新的生活，让你觉得自己正在往前走。'},
{name:'江南诗意温婉型',tag:'会为一场雨改行程的人',cities:['苏州','杭州','绍兴','无锡'],color:'#7FA998',line:'在意日子的质感，喜欢有年头的街巷、应季的吃食，以及可以慢慢走的生活。'},
{name:'海滨自由治愈型',tag:'头发永远是乱的那个人',cities:['厦门','青岛','威海','珠海'],color:'#6E9FC4',line:'需要一条看得见水的边。海风、开阔视野和松弛的日常，能让你重新充满电。'},
{name:'北方豪爽烟火型',tag:'一桌人能坐满的人',cities:['沈阳','西安','天津','哈尔滨'],color:'#C4583F',line:'喜欢热闹的街巷和有人情味的日常。吃得实在、聊得开，有人招呼你坐下，就是家的感觉。'},
{name:'山水静谧避世型',tag:'电量常年只有百分之十',cities:['丽水','婺源','安顺','雅安'],color:'#4F6F5E',line:'需要安静地把自己收回来。窗外有山、夜里有风，生活节奏完全由自己决定。'},
{name:'年轻活力新潮型',tag:'凌晨两点还在群里发语音的人',cities:['成都','长沙','广州','重庆'],color:'#D8AE45',line:'需要城市不断长出新鲜事。新店、新展、新朋友和丰富的夜生活，都是你的快乐燃料。'},
{name:'四季如春康养型',tag:'保温杯不离手的人',cities:['昆明','贵阳','普洱','大理'],color:'#9EBD7E',line:'把身体和舒适放在第��位。温和的气候、阳光、公园和便利的日常，让生活少一点折腾。'},
{name:'古韵人文底蕴型',tag:'在旧书店里待一下午的人',cities:['洛阳','南京','泉州','大同'],color:'#A9743F',line:'喜欢有过去、有故事的地方。旧砖、老街、博物馆和手艺，让你在城市里慢慢发现新的细节。'},
{name:'多元包容百搭型',tag:'在哪都能活得像本地人',cities:['几乎任何城市','深圳','成都','昆明'],color:'#8C9BB0',line:'适应力强，不需要某一种固定风景。你重视选择权，也总能在陌生的街上找到自己的生活。'}
];
const prompts=['一年四季，你最想要哪种气候？','你的作息更像哪种生物？','周末下午三点，你在哪里？','你的社交电量大概几格？','你更想住在哪种生活密度里？','说到吃，你的口味是？','你向往的生活节奏是？','抬头的时候，你想看到什么？','湿度这件事，你怎么选？','攒钱买房，你先看什么？','出门这件事，你偏好哪种？','你的行李箱里通常装了什么？','半夜睡不着，你会做什么？','你对邻居有什么期待？','一天里，你最受不了缺什么？','想象一下你的阳台。','你会为什么样的天气请假？','你的理想通勤是？','朋友来你的城市玩，你带他们去哪？','你怕哪一种无聊？','你的房间最像哪一种？','一天里你最喜欢哪个时刻？','你怎么看待热闹？','你更愿意为什么打开钱包？','你希望城市的声音是什么样的？','搬家那天，你最先拆哪个箱子？','你对四季有什么期待？','你理想的一夜是？','你受得了多大程度的不方便？','给未来的家写一块门牌，你写？','你想在哪个瞬间觉得住对了？','最后，你对定居两个字的感觉是？'];
const traits=['慢慢走，有树荫和老店','准点、快速，最好不必等待','穿过小巷，路过开着的窗','沿着海或河一直走','和一桌朋友热热闹闹地吃饭','一个人安静待着，听听风和虫鸣','晚上还有新鲜去处，随时能约朋友','阳光、公园和一段舒服的散步','逛旧街、书店，听一段城市故事','什么都有一点，热闹和安静只隔一条街'];
let index=0,answers=Array(32).fill(null),lock=false;const $=s=>document.querySelector(s);
function show(id){document.querySelectorAll('.view').forEach(x=>x.classList.remove('active'));$('#'+id).classList.add('active');window.scrollTo(0,0)}
function render(){const q=index,group=[q%10,(q+3)%10,(q+6)%10,(q+8)%10];$('#number').textContent=String(q+1).padStart(2,'0');$('#fill').style.width=(q/32*100)+'%';$('#question').innerHTML='<div class="qno">第 '+String(q+1).padStart(2,'0')+' 题</div><h2>'+prompts[q]+'</h2><div class="options">'+group.map((t,k)=>'<button class="option '+(answers[q]===t?'selected':'')+'" data-type="'+t+'"><span class="letter">'+String.fromCharCode(65+k)+'</span><span>'+traits[t]+'</span></button>').join('')+'</div>';document.querySelectorAll('.option').forEach(b=>b.onclick=()=>{if(lock)return;lock=true;answers[index]=+b.dataset.type;setTimeout(()=>{lock=false;if(index<31){index++;render()}else finish()},180)})}
$('#start').onclick=()=>{index=0;answers.fill(null);render();show('quiz')};$('#back').onclick=()=>{if(index===0)show('home');else{index--;render()}};
function finish(){const scores=Array(10).fill(0);answers.forEach(x=>{if(x!==null)scores[x]++});const order=scores.map((score,id)=>({id,score})).sort((a,b)=>b.score-a.score||a.id-b.id),top=types[order[0].id];$('#result').innerHTML='<div class="result-head" style="--accent:'+top.color+'"><div class="tag">你的定居人格 · '+top.tag+'</div><h2>'+top.name+'</h2><div class="cities">'+top.cities.map(c=>'<span class="city">'+c+'</span>').join('')+'</div></div><p class="block">32 道题里，有 <b class="score">'+order[0].score+'</b> 道指向这类生活。以下是与你契合度较高的类型：</p><div class="block"><h3>生活适配解读</h3><p>'+top.line+'</p></div><div class="block"><h3>你的契合顺位</h3><div class="ranking">'+order.slice(0,3).map((x,i)=>'<div class="rank"><span>第'+['一','二','三'][i]+'顺位 · '+types[x.id].name+'</span><b>'+x.score+' / 32</b></div>').join('')+'</div></div><div class="actions"><button class="btn" id="copy">复制我的结果文案</button><button class="btn secondary" id="again">重新测一次</button></div><p class="foot">趣味测试仅供娱乐，不含任何地域评价；十种生活方式没有高下之分，所有城市都值得被喜欢。</p>';$('#again').onclick=()=>$('#start').click();$('#copy').onclick=()=>{const text='我测出来是「'+top.name+'」——'+top.tag+'。代表城市：'+top.cities.join('、')+'。'+top.line+' #城市定居测试';if(navigator.clipboard&&window.isSecureContext)navigator.clipboard.writeText(text).then(()=>toast('已复制结果')).catch(()=>fallback(text));else fallback(text)};show('result')}
function fallback(text){const area=document.createElement('textarea');area.value=text;document.body.appendChild(area);area.select();try{document.execCommand('copy');toast('已复制结果')}catch(e){toast('复制失败，请手动截图保存')}area.remove()}function toast(text){const t=$('#toast');t.textContent=text;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),1800)}
</script><div class="toast" id="toast"></div></body></html>
