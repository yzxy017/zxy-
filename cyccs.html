<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>测一测，你适合在哪个城市定居</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%2322201C'/%3E%3Cpath d='M8 22V11l8 5 8-5v11' stroke='%23F3EDE1' stroke-width='2.4' fill='none'/%3E%3C/svg%3E">
<link rel="stylesheet" href="https://miaoda.feishu.cn/fonts/css2?family=Noto+Serif+SC:wght@400;600;700;900&family=Noto+Sans+SC:wght@300;400;500;700&display=swap">
<style>
:root{
  --paper:#F3EDE1;
  --paper-2:#EBE4D5;
  --ink:#22201C;
  --ink-2:#5B564C;
  --line:#C9C0AC;
  --red:#C8402F;
  --mustard:#C9A227;
  --moss:#5C7360;
  --serif:"Noto Serif SC","Songti SC",Georgia,serif;
  --sans:"Noto Sans SC","PingFang SC",-apple-system,sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  background:var(--paper);
  color:var(--ink);
  font-family:var(--sans);
  min-height:100vh;
  display:flex;justify-content:center;
  background-image:
    radial-gradient(circle at 20% 0%,rgba(201,162,39,.10),transparent 45%),
    radial-gradient(circle at 90% 100%,rgba(92,115,96,.10),transparent 45%);
}
.stage{
  width:100%;max-width:430px;
  min-height:100vh;
  padding:0 22px 96px;
  position:relative;
  display:flex;flex-direction:column;
}
/* ===== 纸纹与撕线 ===== */
.tearline{
  height:16px;width:100%;
  background-image:radial-gradient(circle at 8px 8px,var(--paper-2) 6px,transparent 6.5px);
  background-size:16px 16px;
  opacity:.9;
}
/* ===== 顶部小标 ===== */
.kicker{
  display:flex;align-items:center;justify-content:space-between;
  padding:22px 2px 0;
  font-size:11px;letter-spacing:.18em;color:var(--ink-2);
  font-weight:500;
}
.kicker .dot{width:6px;height:6px;border-radius:50%;background:var(--red);display:inline-block;margin-right:6px;vertical-align:1px}
.kicker .r{letter-spacing:.06em;color:var(--ink-2);opacity:.75}

/* ===== 视图容器 ===== */
.view{display:none;flex:1;flex-direction:column}
.view.on{display:flex}

/* ===== 首页 ===== */
.hero{margin-top:26px;position:relative}
.hero h1{
  font-family:var(--serif);
  font-weight:900;
  font-size:40px;line-height:1.18;
  margin:0 0 14px;
  letter-spacing:-.5px;
}
.hero h1 em{
  font-style:normal;
  background:linear-gradient(transparent 62%,rgba(201,162,39,.55) 62%,rgba(201,162,39,.55) 92%,transparent 92%);
  padding:0 2px;
}
.hero .sub{
  font-size:14.5px;line-height:1.75;color:var(--ink-2);
  margin:0;max-width:24em;
}
.stamp-row{display:flex;align-items:center;gap:10px;margin:22px 0 4px}
.stamp{
  border:1.5px solid var(--red);color:var(--red);
  font-size:10.5px;letter-spacing:.14em;
  padding:5px 9px;border-radius:2px;
  transform:rotate(-2.5deg);
  font-weight:700;
}
.stamp.alt{border-color:var(--moss);color:var(--moss);transform:rotate(1.5deg)}
.skyline{width:100%;height:64px;margin:6px 0 2px;color:var(--moss);opacity:.85}

/* ===== 卖点四格 ===== */
.features{
  margin-top:20px;
  border-top:1.5px solid var(--ink);
  display:grid;grid-template-columns:1fr 1fr;
  gap:0;
}
.feat{
  padding:16px 0 14px;
  border-bottom:1px solid var(--line);
  display:flex;gap:10px;align-items:flex-start;
}
.feat:nth-child(odd){border-right:1px solid var(--line);padding-right:14px}
.feat:nth-child(even){padding-left:14px}
.feat svg{width:18px;height:18px;flex:0 0 18px;margin-top:2px;color:var(--red)}
.feat:nth-child(2) svg,.feat:nth-child(4) svg{color:var(--moss)}
.feat b{display:block;font-size:13.5px;font-weight:700;letter-spacing:.02em}
.feat span{display:block;font-size:11.5px;color:var(--ink-2);margin-top:4px;line-height:1.5}

/* ===== 主按钮 ===== */
.cta{
  margin-top:26px;
  width:100%;
  border:none;
  background:var(--ink);
  color:var(--paper);
  font-family:var(--serif);
  font-weight:700;
  font-size:17px;
  letter-spacing:.06em;
  padding:18px 0;
  border-radius:999px;
  cursor:pointer;
  position:relative;
  box-shadow:0 8px 0 -2px rgba(34,32,28,.18);
  transition:transform .18s ease,box-shadow .18s ease;
}
.cta:active{transform:translateY(3px);box-shadow:0 4px 0 -2px rgba(34,32,28,.18)}
.foot-note{
  text-align:center;font-size:11px;color:var(--ink-2);
  margin:14px 0 0;line-height:1.7;opacity:.8;
}

/* ===== 答题页 ===== */
.qhead{display:flex;align-items:flex-end;justify-content:space-between;margin-top:20px}
.qidx{font-family:var(--serif);font-size:13px;letter-spacing:.04em;color:var(--ink-2)}
.qidx b{color:var(--ink);font-size:22px;margin-right:2px}
.backbtn{
  background:none;border:none;font-size:12px;color:var(--ink-2);
  padding:4px 0;cursor:pointer;letter-spacing:.06em;
}
.bar{height:3px;background:var(--line);margin-top:10px;position:relative;border-radius:2px;overflow:hidden}
.bar i{position:absolute;left:0;top:0;bottom:0;background:var(--red);border-radius:2px;transition:width .3s ease}
.qbody{flex:1;display:flex;flex-direction:column;justify-content:center;padding:26px 0 10px}
.qtext{
  font-family:var(--serif);font-weight:700;
  font-size:23px;line-height:1.48;
  margin:0 0 26px;
  letter-spacing:-.2px;
}
.opts{display:flex;flex-direction:column;gap:11px}
.opt{
  display:flex;align-items:center;gap:12px;
  text-align:left;
  background:var(--paper);
  border:1.5px solid var(--ink);
  border-radius:12px;
  padding:15px 16px;
  font-family:var(--sans);
  font-size:14.5px;line-height:1.5;
  color:var(--ink);
  cursor:pointer;
  transition:transform .15s ease,background .15s ease;
}
.opt:hover{background:#fff}
.opt:active{transform:scale(.985)}
.opt.chosen{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.opt .mark{
  flex:0 0 22px;width:22px;height:22px;border-radius:50%;
  border:1.2px solid currentColor;
  font-size:11px;font-weight:700;
  display:flex;align-items:center;justify-content:center;
  font-family:var(--serif);
}

/* ===== 结果页 ===== */
.res-kicker{margin-top:22px;font-size:11px;letter-spacing:.2em;color:var(--red);font-weight:700}
.res-city{
  font-family:var(--serif);font-weight:900;
  font-size:56px;line-height:1.05;margin:8px 0 2px;letter-spacing:-1px;
}
.res-city small{font-size:15px;letter-spacing:.2em;font-weight:400;color:var(--ink-2);margin-left:8px;vertical-align:6px}
.res-persona{font-family:var(--serif);font-size:17px;font-weight:600;color:var(--ink);margin:6px 0 0}
.res-persona:before{content:"";display:inline-block;width:16px;height:2px;background:var(--red);vertical-align:5px;margin-right:8px}

.score-wrap{display:flex;align-items:center;gap:16px;margin:20px 0 4px;padding:16px 0;border-top:1.5px solid var(--ink);border-bottom:1px solid var(--line)}
.score-num{font-family:var(--serif);font-weight:900;font-size:44px;line-height:1;color:var(--red);white-space:nowrap;flex:0 0 auto}
.score-num i{font-style:normal;font-size:15px;font-weight:400;color:var(--ink-2);margin-left:1px}
.score-desc{font-size:12px;line-height:1.7;color:var(--ink-2);flex:1}

.res-desc{font-size:14px;line-height:1.95;color:var(--ink);margin:18px 0 0;letter-spacing:.01em}
.res-desc p{margin:0 0 10px}

.tagrow{display:flex;flex-wrap:wrap;gap:8px;margin:16px 0 0}
.tagrow span{
  font-size:11.5px;color:var(--ink-2);
  border:1px dashed var(--line);
  padding:5px 10px;border-radius:999px;
}

.day-block{margin-top:24px}
.block-title{
  font-size:11px;letter-spacing:.18em;color:var(--ink-2);
  display:flex;align-items:center;gap:8px;font-weight:700;
}
.block-title:after{content:"";flex:1;height:1px;background:var(--line)}
.day-item{display:grid;grid-template-columns:52px 1fr;gap:12px;padding:12px 0;border-bottom:1px dashed var(--line)}
.day-item time{font-family:var(--serif);font-size:13px;color:var(--red);font-weight:700;letter-spacing:.02em}
.day-item p{margin:0;font-size:13.5px;line-height:1.6;color:var(--ink)}

.alt-zone{margin-top:22px}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.chip{
  background:var(--paper-2);border:none;
  font-family:var(--serif);font-size:13.5px;font-weight:600;
  padding:8px 14px;border-radius:999px;color:var(--ink);
}

.quote{
  margin-top:24px;
  font-family:var(--serif);
  font-size:16px;line-height:1.9;
  padding:18px 18px 16px 30px;
  background:var(--paper-2);
  border-left:4px solid var(--mustard);
  position:relative;
  font-weight:600;
}
.quote:before{content:"“";font-size:34px;color:var(--mustard);position:absolute;left:8px;top:-2px;font-family:var(--serif)}

.rank-zone{margin-top:26px}
.rank-row{display:grid;grid-template-columns:58px 1fr 34px;align-items:center;gap:10px;margin-top:10px;font-size:12.5px}
.rank-row .nm{font-family:var(--serif);font-weight:600}
.rank-row .track{height:8px;background:var(--paper-2);border-radius:4px;overflow:hidden}
.rank-row .track i{display:block;height:100%;background:var(--moss);border-radius:4px}
.rank-row.top .track i{background:var(--red)}
.rank-row .pc{text-align:right;color:var(--ink-2);font-size:11px}

.btn-ghost{
  margin:28px 0 0;width:100%;
  background:none;border:1.5px solid var(--ink);
  color:var(--ink);font-family:var(--serif);font-weight:700;font-size:15px;
  letter-spacing:.06em;padding:15px 0;border-radius:999px;cursor:pointer;
}

/* ===== 角标（每页固定） ===== */
.corner-l,.corner-r{position:fixed;bottom:16px;z-index:9;font-size:10px;letter-spacing:.04em;pointer-events:none}
.corner-l{left:14px;color:var(--red);font-weight:700}
.corner-l:before{content:"";display:inline-block;width:5px;height:5px;border-radius:50%;background:var(--red);margin-right:5px;vertical-align:1px}
.corner-r{right:14px;color:#111;font-weight:600;background:transparent}

@media (max-width:380px){
  .hero h1{font-size:33px}
  .res-city{font-size:46px}
  .qtext{font-size:21px}
}
@media (prefers-reduced-motion:reduce){
  *{transition:none!important}
}
</style>
</head>
<body>
<div class="stage">

  <!-- ===== 视图：首页 ===== -->
  <section class="view on" id="v-home">
    <div class="kicker"><span><i class="dot"></i>城市定居指数 · 32题</span><span class="r">vol.01</span></div>

      </div>

        <div><b>烟火浓度</b><span>楼下有没有夜宵和菜市场</span></div>

        <div><b>城市气质</b><span>你心里那座城，长什么样子</span></div>
      </div>
    </div>

    <button class="cta" id="startBtn">点击测试 →</button>
    <p class="foot-note">趣味测试仅供娱乐，别拿结果去搬家。</p>
  </section>

  <!-- ===== 视图：答题 ===== -->
  <section class="view" id="v-quiz">
    <div class="kicker"><span><i class="dot"></i>城市定居指数</span><span class="r">vol.01</span></div>
    <div class="qhead">
      <div class="qidx">第 <b id="qNum">1</b> / 32 题</div>
      <button class="backbtn" id="backBtn">← 上一题</button>

    <div class="bar"><i id="barFill" style="width:3%"></i></div>
    <div class="qbody">
      <h2 class="qtext" id="qText"></h2>
      <div class="opts" id="optBox"></div>

  <!-- ===== 视图：结果 ===== -->
  <section class="view" id="v-result">
    <div class="kicker"><span><i class="dot"></i>你的定居报告</span><span class="r" id="resDate"></span></div>
    <div class="tearline"></div>
    <div class="res-kicker">你的定居城市是</div>
    <h2 class="res-city"><span id="resCity"></span><small id="resEn"></small></h2>
    <p class="res-persona" id="resPersona"></p>

    <div class="score-wrap">
      <div class="score-num"><b id="resPc" style="font-weight:900">88</b><i>%</i></div>
      <div class="score-desc" id="resScoreDesc"></div>

    <div class="res-desc" id="resDesc"></div>

      <div class="block-title">你的城市得分分布</div>
      <div id="resRank"></div>
    </div>

    <button class="btn-ghost" id="againBtn">再测一次</button>
  </section>

</div>

<!-- 固定角标：每页都有 -->
<span class="corner-l">趣味性测试·非专业诊断</span>
<span class="corner-r">一椰小金桔专属站点</span>

<script>
/* ===== 城市结果池 ===== */
const CITY = {
  DL:{name:"大理",en:"DALI",persona:"松弛感野生艺术家",tags:["不赶时间","风与云","一个人的院子"],
      desc:["你身上有一种罕见的本事：不着急。别人在赶地铁的时候，你在等一朵云飘过去，而且并不觉得这是浪费时间。","你需要的是一个能让你“慢下来还不心虚”的地方——有山、有水、有太阳，房租不至于把你摁在地上，街上有人认得你。","对你来说，定居不是买一张床，是终于可以按自己的呼吸频率活。"],
      day:[["08:30","被太阳晒醒，先不急着起，先听外面有没有风"],["14:00","院子里坐一下午，咖啡凉了也不续"],["21:00","街上已经没人了，你还在走"]],
      alts:["丽江","腾冲","昆明"],
      quote:"慢不是懒，是我终于按自己的节奏活了。"},
  CD:{name:"成都",en:"CHENGDU",persona:"巴适生活家",tags:["烟火气","一杯茶一下午","越夜越安逸"],
      desc:["你是那种一坐下就能把气氛拉松的人——不端着，不较劲，一顿火锅能解决百分之八十的情绪问题。","你需要的城市不用多壮丽，但楼下必须有菜市场、有夜宵、有一群愿意陪你摆龙门阵的人。","你真正想要的不是安逸，是“努力也有人陪着一起不努力”的安全感。"],
      day:[["09:00","睡到自然醒，下楼吃碗面"],["15:00","茶馆里坐着，茶凉了也没人赶你"],["23:00","夜宵摊刚支起来，正好"]],
      alts:["重庆","长沙","昆明"],
      quote:"生活嘛，巴适一点，天塌不下来。"},
  HZ:{name:"杭州",en:"HANGZHOU",persona:"诗意效率双修者",tags:["忙但有风景","骑车通勤","秋天的桂花"],
      desc:["你很难接受“纯粹的躺”和“纯粹的内卷”，你想两边都要：白天很拼，晚上还能去湖边走走。","你挑城市的第一标准是“喘得上气”——通勤路上有点风景，周末十分钟能进山，忙的时候也不至于变成一台机器。","你是那种嘴上说想要安逸，身体却一直在往前跑的人。"],
      day:[["07:30","骑车过桥，风把头发吹乱"],["19:30","加班到天黑，出了写字楼就闻到桂花"],["22:00","湖畔走一圈，把今天卸下来"]],
      alts:["苏州","上海","厦门"],
      quote:"我要的不是清闲，是忙完之后还有地方能喘口气。"},
  SH:{name:"上海",en:"SHANGHAI",persona:"精致独居派",tags:["体面","边界感","两千人的微信"],
      desc:["你相信“规则”和“专业”能换来自由，愿意为效率和体面多付一点房租。","你享受一个人吃饭、一个人看展、一个人回家——不是孤独，是你把独处安排得很好看。","你需要的城市不必温柔，但要够宽阔：机会多，选择多，没人管你几点回家。"],
      day:[["08:10","地铁上站四十分钟，耳朵里是播客"],["20:00","看完一场展，在街角吃完一顿简餐"],["23:30","回家路上便利店还亮着"]],

  CQ:{name:"重庆",en:"CHONGQING",persona:"热辣立体派",tags:["8D魔幻","江边的风","一顿火锅交朋友"],
      desc:["你身上有种江湖气：直、热、不怕折腾，情绪来得很猛，但从不记仇。","你要的城市必须有“起伏”——有坡、有江、有穿楼的轻轨，日子不至于平得像一张纸。","你适应力惊人，别人被地形劝退，你把它当游乐场。"],
      day:[["10:00","爬了两段坡，才算出了小区"],["18:00","火锅点了鸳鸯，最后只吃红锅"],["01:00","江边看灯，风大得想喊一嗓子"]],

/* ===== 状态 ===== */
let idx = 0;
const answers = new Array(32).fill(null);

const vHome = document.getElementById('v-home');
const vQuiz = document.getElementById('v-quiz');
const vRes  = document.getElementById('v-result');

function show(v){
  [vHome,vQuiz,vRes].forEach(el=>el.classList.remove('on'));
  v.classList.add('on');
  window.scrollTo({top:0,behavior:'auto'});
}

function renderQ(){
  const q = QUESTIONS[idx];
  document.getElementById('qNum').textContent = idx+1;
  document.getElementById('barFill').style.width = ((idx+1)/QUESTIONS.length*100).toFixed(1)+'%';
  document.getElementById('qText').textContent = q.q;
  const box = document.getElementById('optBox');
  box.innerHTML = '';
  const letters = ['A','B','C','D'];
  q.o.forEach((o,i)=>{
    const b = document.createElement('button');
    b.className = 'opt' + (answers[idx]===i?' chosen':'');
    b.innerHTML = '<span class="mark">'+letters[i]+'</span><span>'+o.t+'</span>';
    b.addEventListener('click',()=>pick(i));
    box.appendChild(b);
  });
}

function pick(i){
  answers[idx] = i;
  const chosen = document.querySelectorAll('.opt')[i];
  if(chosen) chosen.classList.add('chosen');
  setTimeout(()=>{
    if(idx < QUESTIONS.length-1){ idx++; renderQ(); }
    else { compute(); }
  }, 220);
}

document.getElementById('startBtn').addEventListener('click',()=>{
  idx = 0; answers.fill(null);
  show(vQuiz); renderQ();
});
document.getElementById('backBtn').addEventListener('click',()=>{
  if(idx>0){ idx--; renderQ(); }
});
document.getElementById('againBtn').addEventListener('click',()=>{
  idx = 0; answers.fill(null);
  show(vHome);
});

function compute(){
  const score = {};
  Object.keys(CITY).forEach(k=>score[k]=0);
  answers.forEach((a,i)=>{
    if(a===null) return;
    const tag = QUESTIONS[i].o[a].c;
    score[tag] = (score[tag]||0)+1;
  });
  const rank = Object.keys(score).map(k=>({k,v:score[k]})).sort((a,b)=>b.v-a.v);
  const top = rank[0].k;
  const c = CITY[top];
  const pc = Math.min(99, 56 + Math.round(rank[0].v/QUESTIONS.length*44));

  document.getElementById('resCity').textContent = c.name;
  document.getElementById('resEn').textContent = c.en;
  document.getElementById('resPersona').textContent = c.persona;
  document.getElementById('resPc').textContent = pc;
  document.getElementById('resScoreDesc').innerHTML =
    '你和<b>'+c.name+'</b>的匹配度<br>在 32 道生活方式选择题里，<br>你为这座城市投了 '+rank[0].v+' 次票。';
  document.getElementById('resDesc').innerHTML = c.desc.map(p=>'<p>'+p+'</p>').join('');
  document.getElementById('resTags').innerHTML = c.tags.map(t=>'<span># '+t+'</span>').join('');
  document.getElementById('resDay').innerHTML = c.day.map(d=>'<div class="day-item"><time>'+d[0]+'</time><p>'+d[1]+'</p></div>').join('');
  document.getElementById('resAlts').innerHTML = c.alts.map(a=>'<span class="chip">'+a+'</span>').join('');
  document.getElementById('resQuote').textContent = c.quote;

  const max = rank[0].v;
  document.getElementById('resRank').innerHTML = rank.slice(0,3).map((r,i)=>{
    const nm = CITY[r.k].name;
    return '<div class="rank-row'+(i===0?' top':'')+'"><span class="nm">'+nm+'</span><span class="track"><i style="width:'+(r.v/(max||1)*100)+'%"></i></span><span class="pc">'+r.v+' 票</span></div>';
  }).join('');

  const d = new Date();
  document.getElementById('resDate').textContent = (d.getMonth()+1)+'月'+d.getDate()+'日';
  show(vRes);
}
</script>
