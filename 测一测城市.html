        { text: "东北大碗香喷喷面食", score: "haerbin" }
      ]
    },
    {
      title: "提到年轻活力想到哪座城？",
      options: [
        { text: "遍地年轻人的深圳", score: "shenzhen" },
        { text: "自由浪漫大理小城", score: "dali" },
        { text: "潮流先锋大上海", score: "shanghai" },
        { text: "阳光海岛海口", score: "haikou" }
      ]
    },
    {
      title: "你理想的城市关键词？",
      options: [
        { text: "冰雪、豪爽、热闹", score: "haerbin" },
        { text: "海风、小岛、清新", score: "xiamen" },
        { text: "古韵、历史、美食", score: "xian" },
        { text: "热血、机遇、拼搏", score: "shenzhen" }
      ]
    },
    {
      title: "做完测试，你更向往？",
      options: [
        { text: "有风景，有温柔日子", score: "hangzhou" },
        { text: "有自由，不用被催促", score: "dali" },
        { text: "有梦想，敢向前闯荡", score: "shenzhen" },
        { text: "有美食，天天很开心", score: "chengdu" }
      ]
    }
  ];

  let currentQuestion = 0;
  let scoreObj = {
    hangzhou: 0,
    dali: 0,
    shanghai: 0,
    chengdu: 0,
    xiamen: 0,
    haerbin: 0,
    shenzhen: 0,
    xian: 0,
    haikou: 0,
    chongqing: 0
  };

  const pageHome = document.getElementById("page-home");
  const pageQuestion = document.getElementById("page-question");
  const pageResult = document.getElementById("page-result");
  const btnStart = document.getElementById("btn-start");
  const btnRestart = document.getElementById("btn-restart");
  const questionTitle = document.getElementById("question-title");
  const optionList = document.getElementById("option-list");
  const progressText = document.getElementById("progress-text");
  const progressFill = document.getElementById("progress-fill");
  const resCity = document.getElementById("res-city");
  const resText = document.getElementById("res-text");

  function switchPage(el) {
    document.querySelectorAll(".page").forEach(p => p.classList.remove("active"));
    el.classList.add("active");
  }

  function resetAll() {
    currentQuestion = 0;
    scoreObj = {
      hangzhou: 0,
      dali: 0,
      shanghai: 0,
      chengdu: 0,
      xiamen: 0,
      haerbin: 0,
      shenzhen: 0,
      xian: 0,
      haikou: 0,
      chongqing: 0
    };
  }

  function renderQuestion() {
    const q = questionList[currentQuestion];
    questionTitle.innerText = q.title;
    optionList.innerHTML = "";
    const percent = (currentQuestion / 32) * 100;
    progressFill.style.width = percent + "%";
    progressText.innerText = `${currentQuestion} / 32`;

    q.options.forEach(opt => {
      const div = document.createElement("div");
      div.className = "option-item";
      div.innerText = opt.text;
      div.onclick = () => {
        scoreObj[opt.score]++;
        currentQuestion++;
        if (currentQuestion >= questionList.length) {
          showResult();
        } else {
          renderQuestion();
        }
      }
      optionList.appendChild(div);
    })
  }

  function showResult() {
    let maxKey = "hangzhou";
    let maxVal = 0;
    for (const k in scoreObj) {
      if (scoreObj[k] > maxVal) {
        maxVal = scoreObj[k];
        maxKey = k;
      }
    }
    const myRes = resultList.find(r => r.key === maxKey);
    resCity.innerText = myRes.title;
    resText.innerText = myRes.desc;
    switchPage(pageResult);
  }

  btnStart.onclick = () => {
    resetAll();
    switchPage(pageQuestion);
    renderQuestion();
  }

  btnRestart.onclick = () => {
    resetAll();
    switchPage(pageHome);
  }
</script>
</body>
</html>
